<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 600" role="img" aria-labelledby="tree-title tree-desc" font-family="Open Sans, sans-serif">
<title id="tree-title">The Sangathika tree</title>
<desc id="tree-desc">A tree with thirteen labelled leaves. Three root leaves (Functions, Trigonometry, Exponentials and logarithms) grow below the soil line. Four leaves grow on the trunk (Logic and sets, Counting, Modular arithmetic, Graphs). The crown holds Probability and Statistics on the left bough, Sequences, Differentiation and Integration on the right bough, and Linear Algebra at the top.</desc>
<metadata>සංගතික · Sangathika · SAM. © 2026 Niranga Dharmaratna. CC BY-SA 4.0.</metadata>
<defs>
  <path id="blade" d="M0,0 C-26,-18 -38,-52 0,-86 C38,-52 26,-18 0,0 Z"/>
  <g id="veins" fill="none" stroke-width="1.2">
    <path d="M0,0 L0,-86"/>
    <path d="M0,-22 L-13,-38 M0,-22 L13,-38 M0,-42 L-14,-56 M0,-42 L14,-56 M0,-60 L-9,-70 M0,-60 L9,-70"/>
  </g>
  <style>
    .blade{fill:var(--moss-tint,#dfe6cf);stroke:var(--ink,#33363d);stroke-width:2}
    .vein{stroke:var(--eig,#6f8f4a)}
    .wood{fill:none;stroke:var(--bark-tint,#d8c7b3);stroke-linecap:round;stroke-linejoin:round}
    .woodedge{fill:none;stroke:var(--ink,#33363d);stroke-linecap:round;stroke-linejoin:round}
    .barkline{fill:none;stroke:var(--bark,#8a6f52);stroke-width:1.3;stroke-linecap:round}
    .twig{fill:none;stroke:var(--bark,#8a6f52);stroke-width:2.5;stroke-linecap:round}
    .soil{fill:none;stroke:var(--ink,#33363d);stroke-width:2}
    .soilfill{fill:var(--surface,#f6ecda)}
    .grass{fill:none;stroke:var(--eig,#6f8f4a);stroke-width:1.5;stroke-linecap:round}
    .root{fill:none;stroke:var(--bark,#8a6f52);stroke-width:6;stroke-linecap:round}
    .rootthin{fill:none;stroke:var(--bark,#8a6f52);stroke-width:2.5;stroke-linecap:round}
    .lbl{font-size:12px;fill:var(--ink,#33363d)}
    .lbl.big{font-size:14px;font-weight:600}
    .grp{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;fill:var(--muted,#5d6069)}
    .tree-leaf{cursor:pointer}
    .tree-leaf:hover .blade,.tree-leaf:focus .blade{fill:var(--crimson-tint,#ead1dc)}
    .tree-leaf.coming .blade{fill:var(--surface,#f6ecda)}
  </style>
</defs>

